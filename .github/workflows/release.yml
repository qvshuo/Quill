name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Select latest Xcode
        run: |
          ls /Applications | grep "^Xcode" | sort -V | tail -1
          sudo xcode-select -s "/Applications/$(ls /Applications | grep '^Xcode' | sort -V | tail -1).app"

      - name: Build unsigned device app
        run: |
          xcodebuild -project Quill.xcodeproj -scheme Quill -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/dd build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned ipa
        run: |
          mkdir -p stage/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/Quill.app stage/Payload/
          cd stage && zip -rqy -X "Quill-${GITHUB_REF_NAME#v}-unsigned.ipa" Payload

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Quill ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            stage/Quill-${GITHUB_REF_NAME#v}-unsigned.ipa
